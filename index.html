<html lang="en">
<head>

<title>Candid Cull</title>

<style>
:root {
  --ink: #2A2D32; --dark: #434343; --pink: #D03392; --purple: #5A358C; --blue: #2C59A8;
  --grad: linear-gradient(90deg, #D03392 0%, #5A358C 55%, #2C59A8 100%);
  --red: #E4002B; --line: #DCDEE2; --tint: #F3F3F6; --tint2: #FAFAFB; --muted: #8A9099;
  --green: #1E8E5A; --amber: #B7791F;
  --canvas: #1b1d21; --canvas2: #25282d; --canvas-line: #3a3e45; --canvas-text: #e8e9ec; --canvas-muted: #9aa0a9;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: #fff; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.screen { min-height: 100vh; }

/* ---------- top bar (home) ---------- */
.topbar { background: var(--grad); color: #fff; display: flex; align-items: center; gap: 14px; padding: 12px 28px; }
.topbar img.mark { height: 34px; width: auto; display: block; }
.topbar .t1 { font-weight: 700; font-size: 17px; line-height: 1.15; }
.topbar .t2 { font-size: 13px; opacity: .9; }
.topbar .grow { flex: 1; }
.pill { border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; padding: 9px 18px; font-size: 14px; }
.pill.ghost { background: rgba(255,255,255,.16); color: #fff; }
.pill.ghost:hover { background: rgba(255,255,255,.28); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #7be0a8; display: inline-block; margin-right: 7px; }
.dot.off { background: #ffd28a; }
.seg { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
.seg button.on { background: #fff; color: var(--ink); }

/* ---------- home ---------- */
.home-main { max-width: 1180px; margin: 0 auto; padding: 34px 28px 60px; }
h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.1; }
.rule { width: 150px; height: 5px; border-radius: 3px; background: var(--grad); margin-bottom: 14px; }
.lede { color: #555a62; margin: 0 0 22px; max-width: 720px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; background: #fff; }
.bar { background: #fff; color: var(--ink); font-weight: 700; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; padding: 12px 16px 0; border-top: 4px solid transparent; border-image: var(--grad) 1; }      /* white card, gradient strip across the top */
.bar.red { background: var(--red); color: #fff; border-image: none; border-top: 0; padding: 9px 16px; }
.box .body { padding: 14px 16px 16px; }
.note { font-size: 13px; color: var(--muted); }
.note.pink, .pink { color: var(--pink); font-weight: 700; }
.path { color: var(--pink); font-weight: 700; text-decoration: underline; }
.alert { border: 2px solid var(--red); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
.alert .body { padding: 12px 16px; }

.field { display: block; width: 100%; border: 1.5px solid var(--ink); border-radius: 6px; background: #fff; padding: 10px 12px; font-size: 16px; }
.field:focus { outline: 3px solid rgba(208, 51, 146, .25); border-color: var(--pink); }
label.lab { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 5px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; }
.btn:hover { background: var(--tint); }
.btn.primary { border: 0; background: var(--grad); color: #fff; padding: 11px 22px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 17px; padding: 15px 30px; }
.btn.small { padding: 5px 12px; font-size: 12.5px; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.linkish { border: 0; background: none; padding: 0; color: var(--purple); font-weight: 700; text-decoration: underline; font-size: 13.5px; }

.daylab { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
.daylab:first-child { margin-top: 0; }
.evlist { max-height: 330px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.ev { display: flex; width: 100%; text-align: left; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 9px 12px; }
.ev:nth-child(even) { background: var(--tint2); }
.ev:last-child { border-bottom: 0; }
.ev:hover { background: var(--tint); }
.ev.on { background: #fbe9f4; box-shadow: inset 4px 0 0 var(--pink); }
.ev .s { font-weight: 700; }
.ev .e { color: #555a62; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .m { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ev.pushed { opacity: .55; }
.chosen { border: 1.5px solid var(--pink); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.chosen .grow { flex: 1; min-width: 0; }
.tseg { display: inline-flex; border: 1.5px solid var(--purple); border-radius: 999px; overflow: hidden; }
.tseg button { border: 0; background: #fff; padding: 8px 16px; font-weight: 700; font-size: 13.5px; }
.tseg button.on { background: var(--grad); color: #fff; }

.item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item:first-child { padding-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .n { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.item .d { font-size: 12.5px; color: var(--muted); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--tint); color: #555a62; white-space: nowrap; }
.tag.ok { background: #e3f4ec; color: var(--green); }
.tag.bad { background: #fde5ea; color: var(--red); }
.tag.wait { background: #fff3dc; color: var(--amber); }

/* ---------- cull screen ---------- */
#cull { background: var(--canvas); color: var(--canvas-text); height: 100vh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
#cull.light { --canvas: #f1f1f4; --canvas2: #fff; --canvas-line: #dcdee2; --canvas-text: #2A2D32; --canvas-muted: #6b717a; }
.cbar { background: #2A2D32; color: #fff; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 3px solid transparent; border-image: var(--grad) 1; flex: none; }
.cbar img.mark { height: 26px; }
.cbar .who { min-width: 0; max-width: 24vw; }
.cbar .who .a { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbar .who .b { font-size: 12px; color: #b9bdc5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { flex: 1; min-width: 180px; }
.meter .txt { font-size: 13px; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; }
.meter .txt b { font-size: 15px; }
.meter .track { position: relative; height: 9px; border-radius: 5px; background: #4a4e56; overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(123, 224, 168, .35); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: #ffd28a; transition: width .15s; }
.meter.good .fill { background: #5fd398; }
.chip { border: 1px solid #5a5f68; background: transparent; color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
button.chip:hover { background: #3a3e45; }
.chip.warn { border-color: #ffd28a; color: #ffd28a; }
.chip.plain { border-color: transparent; color: #cfd2d8; padding: 5px 4px; }
.cbar .btn.primary { padding: 8px 18px; }

.stage { flex: 1; min-height: 0; position: relative; }
.single { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
.single img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; box-shadow: 0 4px 28px rgba(0,0,0,.35); }
.single.tossed img { opacity: .32; }
.badges { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3; }
.badge { background: rgba(20, 21, 24, .78); color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; }
.badge.toss { background: var(--red); font-size: 14px; letter-spacing: .06em; }
.badge.soft { background: #ffd28a; color: #3b2b05; }
.badge.best { background: var(--pink); }
.loading { position: absolute; right: 16px; top: 14px; font-size: 12.5px; color: var(--canvas-muted); z-index: 3; }
.empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--canvas-muted); }

.zoomv { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
.zoomv.drag { cursor: grabbing; }
.zoomv img { position: absolute; max-width: none; image-rendering: auto; -webkit-user-drag: none; }
.zoomv.tossed img { opacity: .45; }

/* the line above the photo: where you are + the burst you're in */
.ctx { flex: none; min-height: 46px; display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: var(--canvas2); border-bottom: 1px solid var(--canvas-line); font-size: 13.5px; white-space: nowrap; overflow: hidden; }
.ctx .where { color: var(--canvas-muted); overflow: hidden; text-overflow: ellipsis; }
.ctx .where b { color: var(--canvas-text); font-size: 15px; }
.ctx .grow { flex: 1; }
.ctx .binfo { display: flex; align-items: center; gap: 10px; padding-left: 14px; border-left: 1px solid var(--canvas-line); }
.ctx .binfo b { font-size: 15px; }
.ctx .bl { background: var(--pink); color: #fff; font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; padding: 3px 8px; }
.ctx .btn.primary { padding: 8px 16px; font-size: 13.5px; flex: none; }
.star { color: #ffd28a; font-weight: 700; }
#cull.light .star, .sheet .star { color: var(--pink); }
.single img.r6 { transform: rotate(90deg); } .single img.r8 { transform: rotate(-90deg); } .single img.r3 { transform: rotate(180deg); }

.strip { flex: none; height: 86px; background: var(--canvas2); border-top: 1px solid var(--canvas-line); display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px; overflow: hidden; }
.th { position: relative; width: 84px; height: 66px; border: 2px solid transparent; border-radius: 5px; background: #111; padding: 0; overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center; }
.th img { max-width: 100%; max-height: 100%; display: block; }
.th img.r6 { transform: rotate(90deg); } .th img.r8 { transform: rotate(-90deg); } .th img.r3 { transform: rotate(180deg); }
.th.cur { border-color: #fff; }
#cull.light .th.cur { border-color: var(--ink); }
.th.toss img { opacity: .25; }
.th.toss::after { content: "\00d7"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff5b78; font-size: 44px; font-weight: 700; line-height: 1; }
.th.inb::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #6b717a; z-index: 1; }      /* part of a burst */
.th.grp::before { height: 4px; background: var(--pink); }                                                                       /* part of the burst being looked at */
.strip.inburst .th:not(.grp) { opacity: .42; }
.th .gn { position: absolute; left: 3px; top: 7px; min-width: 17px; height: 17px; line-height: 17px; border-radius: 9px; background: rgba(20, 21, 24, .82); color: #fff; font-size: 10.5px; font-weight: 700; text-align: center; }
.th .st { position: absolute; right: 3px; top: 6px; color: #ffd28a; font-size: 16px; line-height: 1; text-shadow: 0 0 3px #000, 0 0 3px #000; }
.th .sd { position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; background: #ffd28a; border: 1px solid #3b2b05; }
/* the buttons under the photo */
.abar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 9px 14px 11px; background: var(--canvas2); border-top: 1px solid var(--canvas-line); }
.abar .l { font-size: 12px; color: var(--canvas-muted); min-width: 0; }
.abar .r { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.acts { display: flex; gap: 10px; align-items: center; }
.ab { border: 1.5px solid #5a5f68; background: transparent; color: var(--canvas-text); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.ab:hover { background: rgba(255, 255, 255, .09); }
.ab.small { padding: 6px 12px; font-size: 12.5px; }
.ab.big { padding: 11px 24px; font-size: 16px; min-width: 168px; }
.ab kbd { font-size: 11.5px; opacity: .7; }
.ab.big kbd, .ab .k { margin-left: 7px; }
.ab.toss { border-color: #ff5b78; color: #ff8fa3; }
.ab.toss.on { background: var(--red); border-color: var(--red); color: #fff; }
.ab.keep { border-color: #5fd398; color: #7be0a8; }
.ab.keep.on { background: var(--green); border-color: var(--green); color: #fff; }
#cull.light .ab { border-color: #b9bdc5; }
#cull.light .ab:hover { background: rgba(0, 0, 0, .05); }
#cull.light .ab.toss { border-color: var(--red); color: var(--red); }
#cull.light .ab.keep { border-color: var(--green); color: var(--green); }
#cull.light .ab.toss.on, #cull.light .ab.keep.on { color: #fff; }
kbd { display: inline-block; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; font: inherit; font-size: .92em; font-weight: 700; opacity: .9; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20, 21, 24, .62); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
.sheet { background: #fff; color: var(--ink); border-radius: 10px; width: min(920px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 18px 60px rgba(0,0,0,.4); }
.sheet.narrow { width: min(520px, 100%); }
.sheet .bar { position: sticky; top: 0; }
.sheet .body { padding: 18px 20px 20px; }
.sheet h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
.sheet .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; position: sticky; bottom: 0; background: #fff; padding: 10px 0 2px; }      /* buttons stay in reach on a short screen */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
table.keys { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.keys th { background: #fff; color: var(--ink); border-bottom: 2px solid var(--purple); text-align: left; padding: 6px 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }
table.keys td { padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.keys tr:nth-child(even) td { background: var(--tint2); }
table.keys td:first-child { white-space: nowrap; font-weight: 700; width: 1%; }
ul.plain { margin: 6px 0 12px; padding-left: 20px; font-size: 13.5px; }
ul.plain li { margin: 3px 0; }
ul.how { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
ul.how li { margin: 7px 0; }
h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 14px 0 4px; }
.progress { height: 12px; border-radius: 6px; background: var(--tint); overflow: hidden; margin: 12px 0 6px; }
.progress > div { height: 100%; width: 0; background: var(--grad); transition: width .2s; }

#grid { position: fixed; inset: 0; background: #fff; color: var(--ink); z-index: 40; display: flex; flex-direction: column; user-select: none; }
#grid .gbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#grid .gbar h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
#grid .gbar .grow { flex: 1; }
#grid .gnote { padding: 8px 20px; font-size: 13px; background: var(--tint2); border-bottom: 1px solid var(--line); display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
#grid .gwrap { flex: 1; overflow: auto; padding: 14px 20px 30px; }
.gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gt { position: relative; aspect-ratio: 3 / 2; background: var(--tint); border: 3px solid transparent; border-radius: 6px; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; }
.gt img { max-width: 100%; max-height: 100%; display: block; }
.gt.toss img { opacity: .25; }
.gt.toss { border-color: var(--red); }
.gt.toss::after { content: "TOSSED"; position: absolute; left: 6px; top: 6px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; border-radius: 4px; padding: 2px 6px; }
.gt .sd { position: absolute; right: 6px; top: 6px; background: #ffd28a; color: #3b2b05; font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
.gt:hover { border-color: var(--ink); }

#toast { position: fixed; left: 50%; top: 122px; transform: translateX(-50%); background: rgba(20,21,24,.92); color: #fff; border-radius: 999px; padding: 9px 20px; font-size: 13.5px; font-weight: 700; z-index: 80; pointer-events: none; opacity: 0; transition: opacity .18s; max-width: 80vw; text-align: center; }
#toast.on { opacity: 1; }

.done-wrap { max-width: 760px; margin: 0 auto; padding: 44px 28px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 12px 0 12px 46px; border-bottom: 1px solid var(--line); font-size: 16px; }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--grad); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }

/* ---------- smaller studio screens (1366 x 768 and the like) ---------- */
@media (max-width: 1500px) {
  .ab.big { min-width: 140px; padding: 10px 18px; }
  .ab.small .k { display: none; }
  .cbar { gap: 9px; padding: 8px 10px; }
  .cbar .who { max-width: 17vw; }
  .chip { padding: 5px 9px; font-size: 12px; }
  .cbar .btn.primary { padding: 8px 13px; }
  .meter { min-width: 150px; }
}
@media (max-height: 800px) {
  .ctx { min-height: 40px; padding: 4px 12px; }
  .strip { height: 74px; }
  .th { width: 72px; height: 56px; }
  .abar { padding: 6px 12px 7px; }
  .ab.big { padding: 8px 18px; font-size: 15px; }
  .topbar { padding: 7px 28px; }
  .home-main { padding-top: 14px; }
  .home-main h1 { font-size: 26px; margin-bottom: 6px; }
  .home-main .rule { margin-bottom: 8px; height: 4px; }
  .home-main .lede { display: none; }
  .home-main .box { margin-bottom: 10px; }
  .home-main .box .body { padding: 10px 14px 12px; }
  .evlist { max-height: 168px; }
  .btn.big { padding: 11px 26px; }
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script id="worker-src" type="text/plain">
/* Preview worker. Runs off the main page so the culling screen never freezes.
 * For each photo it: decodes the full JPEG once, makes a screen-size preview and a small thumbnail,
 * and measures how sharp the photo is. Nothing leaves the computer. */
var WORK_EDGE = 3500;        // every step below works from a copy this size, never from the full 33 megapixel photo
self.onmessage = async function (e) {
  var m = e.data;
  try {
    // When the camera wrote the photo's size in its header, ask Chrome for a smaller copy straight away.
    // The full-size picture is then only in memory for a moment, which keeps the computer from bogging down.
    var bmp, W = m.w, H = m.h;
    if (W && H && Math.max(W, H) > WORK_EDGE) {
      bmp = await createImageBitmap(m.file, { resizeWidth: Math.round(W * WORK_EDGE / Math.max(W, H)), resizeQuality: 'low' });      // also turns it the right way up
      var h2 = Math.round(W * bmp.height / bmp.width); if (Math.abs(h2 - H) > 2) H = h2;      // header and picture disagree: trust the picture's shape
    } else {
      bmp = await createImageBitmap(m.file);
      W = bmp.width; H = bmp.height;
    }
    var preview = await scaled(bmp, m.maxEdge, 0.86);
    var thumb = await scaled(bmp, m.thumbEdge, 0.78);
    var sharp = sharpness(bmp, bmp.width, bmp.height);
    bmp.close();
    self.postMessage({ id: m.id, ok: true, preview: preview, thumb: thumb, w: W, h: H, sharp: sharp });
  } catch (err) {
    self.postMessage({ id: m.id, ok: false, error: String((err && err.message) || err) });
  }
};

async function scaled(bmp, edge, quality) {
  var W = bmp.width, H = bmp.height, s = Math.min(1, edge / Math.max(W, H));
  var w = Math.max(1, Math.round(W * s)), h = Math.max(1, Math.round(H * s));
  var c = new OffscreenCanvas(w, h), ctx = c.getContext('2d', { willReadFrequently: true });      // plain memory canvas: nothing goes through the graphics card
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  return await c.convertToBlob({ type: 'image/jpeg', quality: quality });
}

/* Sharpness score.
 * The photo is cut into a grid of tiles and each tile gets an "edge energy" number (variance of the Laplacian).
 * A candid is allowed to have a blurry background, so only the sharpest tiles count. The flattest tiles tell us
 * how much of the energy is just sensor noise (night games at high ISO), and that part is taken back out.
 * Higher = sharper. The number only means something next to other photos from the same card. */
function sharpness(bmp, W, H) {
  var s = Math.min(1, WORK_EDGE / Math.max(W, H));
  var w = Math.max(8, Math.round(W * s)), h = Math.max(8, Math.round(H * s));
  var c = new OffscreenCanvas(w, h), ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, w, h);
  var px = ctx.getImageData(0, 0, w, h).data;
  var g = new Uint8Array(w * h);
  for (var i = 0, j = 1; i < g.length; i++, j += 4) g[i] = px[j];      // green channel is close enough to brightness
  px = null;
  var TX = 16, TY = Math.max(4, Math.round(16 * h / w));
  var tw = Math.floor((w - 2) / TX), th = Math.floor((h - 2) / TY);
  if (tw < 4 || th < 4) return 0;
  var vars = [];
  for (var ty = 0; ty < TY; ty++) {
    for (var tx = 0; tx < TX; tx++) {
      var x0 = 1 + tx * tw, y0 = 1 + ty * th, sum = 0, sq = 0;
      for (var y = y0; y < y0 + th; y++) {
        var r = y * w;
        for (var x = x0; x < x0 + tw; x++) {
          var k = r + x, lap = 4 * g[k] - g[k - 1] - g[k + 1] - g[k - w] - g[k + w];
          sum += lap; sq += lap * lap;
        }
      }
      var n = tw * th, mean = sum / n;
      vars.push(sq / n - mean * mean);
    }
  }
  vars.sort(function (a, b) { return a - b; });
  var noise = vars[Math.floor(vars.length * 0.10)];
  var topN = Math.max(3, Math.round(vars.length * 0.05)), top = 0;
  for (var t = vars.length - topN; t < vars.length; t++) top += vars[t];
  top /= topN;
  return Math.max(0, Math.round((top - 1.5 * noise) * 10) / 10);
}

var $ = function (s, r) { return (r || document).querySelector(s); };

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function niceDay(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return s || '';
  var d = new Date(+m[1], +m[2] - 1, +m[3]), t = new Date(); t.setHours(0, 0, 0, 0);
  var diff = Math.round((t - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'numeric', day: 'numeric' });
}
function lsGet(k, fallback) { try { var v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }

// Pop-up sheet. Resolves with the picked action's value, or null on Esc.
var openSheet = null;
function sheet(o) {
  return new Promise(function (resolve) {
    var el = document.createElement('div'); el.className = 'overlay';
    el.innerHTML = '<div class="sheet ' + (o.wide ? '' : 'narrow') + '" role="dialog">' +
      (o.bar ? '<div class="bar' + (o.red ? ' red' : '') + '">' + esc(o.bar) + '</div>' : '') +
      '<div class="body">' + (o.title ? '<h2>' + esc(o.title) + '</h2>' : '') + (o.html || '') +
      '<div class="actions">' + (o.actions || [{ label: 'OK', primary: true, value: true }]).map(function (a, i) {
        return '<button class="btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '') + '" data-i="' + i + '">' + esc(a.label) + '</button>';
      }).join('') + '</div></div></div>';
    document.body.appendChild(el);
    var acts = o.actions || [{ label: 'OK', primary: true, value: true }];
    function close(v) { if (openSheet && openSheet.el === el) openSheet = null; el.remove(); resolve(v); }
    function pick(i) {
      var a = acts[i]; if (!a) return;
      if (a.fn) { Promise.resolve(a.fn(el)).then(function (v) { if (v !== false) close(v); }); } else close(a.value);
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.actions button'); if (b) { pick(+b.dataset.i); return; }
      if (e.target === el && !o.sticky) close(null);
    });
    openSheet = { el: el, close: close, enter: function () { var i = acts.findIndex(function (a) { return a.primary; }); if (i >= 0) pick(i); }, sticky: !!o.sticky };
    if (o.onOpen) o.onOpen(el, close);
    var f = el.querySelector('input, .actions .primary'); if (f) f.focus();
  });
}
function progressSheet(title, sub) {
  var el = document.createElement('div'); el.className = 'overlay';
  el.innerHTML = '<div class="sheet narrow"><div class="body"><h2>' + esc(title) + '</h2><div class="note" id="psSub">' + esc(sub || '') + '</div><div class="progress"><div></div></div><div class="note" id="psTxt"></div></div></div>';
  document.body.appendChild(el);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();      // so Enter / Space can't press a button hiding behind it
  openSheet = { el: el, close: function () {}, enter: function () {}, sticky: true };
  return {
    set: function (frac, txt) { el.querySelector('.progress > div').style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%'; if (txt != null) el.querySelector('#psTxt').textContent = txt; },
    close: function () { if (openSheet && openSheet.el === el) openSheet = null; el.remove(); }
  };
}

var db = (function () {
  var p;
  function open() {
    return p || (p = new Promise(function (res, rej) {
      var r = indexedDB.open('cady-cull', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); r.result.createObjectStore('sessions'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    }));
  }
  function tx(store, mode, fn) {
    return open().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(store, mode), rq = fn(t.objectStore(store));
        t.oncomplete = function () { res(rq && rq.result); }; t.onerror = function () { rej(t.error); }; t.onabort = function () { rej(t.error); };
      });
    });
  }
  return {
    get: function (s, k) { return tx(s, 'readonly', function (o) { return o.get(k); }); },
    set: function (s, k, v) { return tx(s, 'readwrite', function (o) { return o.put(v, k); }); },
    del: function (s, k) { return tx(s, 'readwrite', function (o) { return o.delete(k); }); },
    all: function (s) { return tx(s, 'readonly', function (o) { return o.getAll(); }); }
  };
})();

  if (m) {
    var c = null; try { c = readConnectCode(decodeURIComponent(m[1])); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (c && S.conn && S.conn.u !== c.u) switchTo = c;            // already linked to a different sheet: ask first (below), never switch quietly
    else if (c) { if (!S.conn || S.conn.k !== c.k) S.linkedByUrl = true; S.conn = c; lsSet('cull.conn', c); }
  }
  var cache = lsGet('cull.cache', null);
  if (cache && S.conn) { S.events = cache.events || []; applySettings(cache.settings); }
  try { S.culled = (await db.get('kv', 'culled')) || null; } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  renderHome();
  loadSessions().then(sweepSavedCards);
  if (switchTo) {
    var sw = await sheet({ bar: 'Double check', red: true, sticky: true, title: 'Switch this computer to a different sheet?',
      html: '<p>This computer is already linked to the Event Leads sheet. The link that was just opened points somewhere else.</p><p>Only switch if your manager gave you this link.</p>',
      actions: [{ label: 'Switch', danger: true, value: true }, { label: 'Keep the current one', primary: true, value: false }] });
    if (sw) { S.conn = switchTo; lsSet('cull.conn', switchTo); S.linkedByUrl = true; S.events = []; lsSet('cull.cache', null); applySettings({}); renderTopbar(); }
  }
  loadEvents();
  refreshCulled();
})();

</script>
</body>
